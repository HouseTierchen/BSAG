<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>BSAG Leitstand</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">BSAG</span>
      <span class="subtitle">Auftrags-Leitstand</span>
    </div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Suchen: Auftrag, Kunde, Person…" autocomplete="off" />
      <select id="priorityFilter" title="Nach Prioritaet filtern">
        <option value="">Alle Prioritaeten</option>
        <option value="hoch">Nur Hoch</option>
        <option value="normal">Nur Normal</option>
        <option value="tief">Nur Tief</option>
      </select>
      <span id="status" class="status" title="Live-Verbindung">●</span>
      <span id="userChip" class="user-chip hidden"></span>
      <button id="logoutBtn" class="btn hidden" title="Abmelden">Abmelden</button>
      <button id="scanBtn" class="btn" title="Auftragsmappe scannen">📷 Scan</button>
      <button id="kpiBtn" class="btn" title="Auswertung / Kennzahlen">📊 Auswertung</button>
      <button id="importBtn" class="btn" title="Excel (.xlsx) oder CSV importieren">⬆ Import</button>
      <input id="importFile" type="file" accept=".xlsx,.csv" hidden />
      <button id="exportBtn" class="btn" title="Als CSV fuer Excel exportieren">⬇ Export</button>
      <button id="rapportBtn" class="btn" title="Tagesrapport (A5) drucken">🖨 Rapport</button>
      <button id="newOrderBtn" class="btn primary">+ Auftrag</button>
    </div>
  </header>

  <main id="board" class="board" aria-live="polite"></main>

  <!-- Auftrag anlegen / bearbeiten -->
  <dialog id="orderDialog" class="dialog">
    <form id="orderForm" method="dialog">
      <h2 id="dialogTitle">Neuer Auftrag</h2>
      <input type="hidden" id="orderId" />
      <div class="grid2">
        <label>Auftragsnummer
          <input id="f_number" required placeholder="2600931" />
        </label>
        <label>Pos-Nr.
          <input id="f_pos" placeholder="30" />
        </label>
      </div>
      <div class="grid2">
        <label>Kunde
          <input id="f_customer" placeholder="Coop Musterstadt" />
        </label>
        <label>Objekt
          <input id="f_object" placeholder="Filiale / Standort" />
        </label>
      </div>
      <label>Bezeichnung / Beschrieb
        <input id="f_title" required placeholder="Programmieren, Fraesen, Bohren" />
      </label>
      <div class="grid2">
        <label>Station
          <select id="f_station"></select>
        </label>
        <label>Prioritaet
          <select id="f_priority">
            <option value="hoch">Hoch</option>
            <option value="normal" selected>Normal</option>
            <option value="tief">Tief</option>
          </select>
        </label>
      </div>
      <div class="grid2">
        <label>Maschinist
          <input id="f_assignee" placeholder="Name" />
        </label>
        <label>Aufwand (h)
          <input id="f_effort" type="number" step="0.5" min="0" placeholder="2" />
        </label>
      </div>
      <label class="check-row">
        <input type="checkbox" id="f_kante" />
        <span>✂ Kantenleimer-Arbeit erforderlich (KLM)</span>
      </label>
      <label>Termin Rampe
        <input id="f_due" type="date" />
      </label>
      <label>Notizen
        <textarea id="f_notes" rows="2" placeholder="Material, Beschlaege, Besonderheiten…"></textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" id="deleteBtn" class="btn danger hidden">Loeschen</button>
        <span class="spacer"></span>
        <button type="button" id="cancelBtn" class="btn">Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>
  </dialog>

  <!-- Detail / Verlauf -->
  <dialog id="detailDialog" class="dialog">
    <div id="detailContent"></div>
    <div class="dialog-actions">
      <button type="button" id="editFromDetail" class="btn">Bearbeiten</button>
      <span class="spacer"></span>
      <button type="button" id="closeDetail" class="btn primary">Schliessen</button>
    </div>
  </dialog>

  <!-- Anmeldung (ohne Passwort) -->
  <dialog id="loginDialog" class="dialog">
    <h2>Anmelden</h2>
    <p class="scan-hint">Bitte auswählen, wer du bist:</p>
    <div id="loginUsers" class="login-users"></div>
  </dialog>

  <!-- Scanner -->
  <dialog id="scanDialog" class="dialog">
    <h2 id="dialogTitle">Auftrag scannen</h2>
    <div id="scanArea">
      <video id="scanVideo" playsinline muted></video>
      <p id="scanHint" class="scan-hint">Kamera wird gestartet… QR-/Barcode der Auftragsmappe in den Rahmen halten.</p>
    </div>
    <label>oder Auftrags-Nummer eingeben
      <input id="scanInput" inputmode="numeric" placeholder="z.B. 2600931 oder 2600931-30" />
    </label>
    <div class="dialog-actions">
      <button type="button" id="scanLookup" class="btn">Suchen</button>
      <span class="spacer"></span>
      <button type="button" id="closeScan" class="btn primary">Schliessen</button>
    </div>
  </dialog>

  <!-- Auswertung / KPIs -->
  <dialog id="kpiDialog" class="dialog">
    <div id="kpiContent"></div>
    <div class="dialog-actions">
      <span class="spacer"></span>
      <button type="button" id="closeKpi" class="btn primary">Schliessen</button>
    </div>
  </dialog>

  <!-- Tagesrapport (A5 quer, Netzwerkdrucker) -->
  <dialog id="rapportDialog" class="dialog rapport-dialog">
    <h2>Tagesrapport</h2>
    <div class="grid2">
      <label>Mitarbeiter
        <select id="rapPerson"></select>
      </label>
      <label>Datum
        <input id="rapDate" type="date" />
      </label>
    </div>
    <div id="rapportPreview" class="rapport-preview"></div>
    <div class="dialog-actions">
      <button type="button" id="rapPrint" class="btn primary">🖨 Drucken</button>
      <span class="spacer"></span>
      <button type="button" id="rapClose" class="btn">Schliessen</button>
    </div>
  </dialog>

  <!-- Druckbereich (nur beim Drucken sichtbar) -->
  <div id="rapportPrint"></div>

  <script src="/rapport-logo.js"></script>
  <script src="/app.js"></script>
</body>
</html>
